# Meeting Siren Configuration Example
# Copy this file to /etc/meeting-siren.yaml and customize as needed

# NATS Connection Settings (required)
nats_url: "nats://localhost:4222"
# For authenticated NATS: "nats://username:password@host:4222"
nats_subject: "alerts.meeting.alarm"

# Audio Configuration
volume_pct: 80                    # Volume percentage (0-100)
sounds:                           # Audio files to play (in order)
  - "/usr/local/share/meeting-siren/alarm1.wav"
  - "/usr/local/share/meeting-siren/alarm2.wav"
# Empty list means no audio files (TTS only)
# sounds: []

# Alarm Repeat Settings
repeat_seconds: 30                # Seconds between repeats
max_repeats: 3                    # Maximum number of repeats per event

# Text-to-Speech Configuration
tts_enabled: true                 # Enable TTS announcements
# tts_command: "/usr/local/bin/my-tts-wrapper"  # Custom TTS command (optional)
# If not specified, falls back to platform defaults: say (macOS) or espeak-ng/espeak (Linux)
# The rendered message will be passed as the last argument to the command
# For complex pipelines (e.g., piper | aplay), create a shell wrapper script
tts_template: "Meeting alert: {{.Title}} in {{.Lead}} minutes"
# Available template variables:
# - {{.Title}}    - Meeting title
# - {{.When}}     - Meeting start time
# - {{.Lead}}     - Lead time in minutes
# - {{.Severity}} - Alert severity (normal/critical)

# Notification Modes (optional)
# Override sounds and/or TTS template per notification mode.
# The "mode" field in the JSON message selects which mode to use.
# If the mode is not configured here, falls back to the top-level sounds/tts_template.
# "is_final_notification": true implicitly uses mode "final" if no explicit "mode" is set.
# notification_modes:
#   reduced:
#     sounds:
#       - "/usr/local/share/meeting-siren/gentle-chime.wav"
#     tts_template: "Reminder: {{.Title}} in {{.Lead}} minutes"
#   final:
#     sounds:
#       - "/usr/local/share/meeting-siren/final-alarm.wav"
#     tts_template: "FINAL WARNING: {{.Title}} starts in {{.Lead}} minutes!"
#   silent:
#     sounds: []           # No sounds
#     tts_template: ""     # Empty string disables TTS for this mode

# Schedule Restrictions
work_hours: "08:00-19:00"         # Only fire during these hours (24h format)
quiet_days: "Sat,Sun"             # Days to skip alarms
# Use full names: "Saturday,Sunday" or abbreviations: "Sat,Sun"
# Empty string disables: work_hours: "" or quiet_days: ""

# State Management
state_dir: "/var/lib/meeting-siren"  # Directory for deduplication state

# Heartbeat Configuration
heartbeat_enabled: false              # Enable heartbeat publishing to NATS
heartbeat_subject: "heartbeat.meeting-siren"  # Subject for heartbeat messages
heartbeat_interval: 60                # Heartbeat interval in seconds (1 minute)
heartbeat_description: "Meeting Siren"  # Service description for monitoring
heartbeat_grace_period: 180           # Grace period in seconds (3 minutes)

# Optional Features
# GPIO buzzer for Raspberry Pi (Linux only)
# gpio_buzzer_pin: 18             # GPIO pin number

# Snooze functionality
# snooze_file: "/tmp/meeting-siren-snooze"  # Touch this file to snooze
# snooze_minutes: 10              # Minutes to snooze

# Example configurations for different scenarios:

# Home office setup (macOS)
# sounds:
#   - "/Users/username/Documents/alarm.wav"
# work_hours: "09:00-17:30"
# quiet_days: "Sat,Sun"

# Server room setup (Linux with GPIO buzzer)
# sounds: []                      # No audio files, use TTS + buzzer
# tts_enabled: true
# gpio_buzzer_pin: 18
# work_hours: ""                  # Always active
# quiet_days: ""

# Critical alerts only
# work_hours: ""                  # Always active
# quiet_days: ""                  # No quiet days
# volume_pct: 100                 # Maximum volume
# max_repeats: 5                  # More repeats

# Development/testing
# sounds: []                      # No sounds during dev
# tts_enabled: false              # No TTS during dev
# work_hours: "09:00-18:00"       # Only during work hours